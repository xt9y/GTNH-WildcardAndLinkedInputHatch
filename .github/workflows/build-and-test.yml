name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  compile-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup workspace
        run: ./gradlew --build-cache --stacktrace setupCIWorkspace

      - name: Apply repository formatting
        run: ./gradlew --build-cache --stacktrace --console=plain spotlessApply

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply spotless formatting"
          git push origin HEAD:master

      - name: Build formatted tree
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --build-cache --stacktrace --console=plain build 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build.log
          retention-days: 7
